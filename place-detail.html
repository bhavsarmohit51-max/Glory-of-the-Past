    <div class="container py-5" id="placeDetailContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-warning"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>

    <script>
        let currentPlace = null;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                loadPlaceDetail(id);
            } else {
                window.location.href = 'places.html';
            }
        });

        async function loadPlaceDetail(id) {
            const container = document.getElementById('placeDetailContainer');
            try {
                const pl = await api.get(`/places/${id}`);
                currentPlace = pl;

                let isFav = false;
                if (auth.isLoggedIn()) {
                    try {
                        isFav = await api.get(`/favorites/check?type=Place&id=${pl.id}`);
                    } catch (e) {}
                }

                container.innerHTML = `
                    <nav aria-label="breadcrumb" class="mb-4">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="index.html" class="text-warning text-decoration-none">Home</a></li>
                            <li class="breadcrumb-item"><a href="places.html" class="text-warning text-decoration-none">Places</a></li>
                            <li class="breadcrumb-item active text-secondary">${pl.name}</li>
                        </ol>
                    </nav>

                    <div class="row g-4">
                        <div class="col-lg-8">
                            <div class="historical-card overflow-hidden mb-4">
                                <img src="${pl.imageUrl || 'https://images.unsplash.com/photo-1564507592333-c60657eea523?w=1200'}" class="w-100" style="max-height: 440px; object-fit: cover;" alt="${pl.name}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1564507592333-c60657eea523?w=1200';">
                                <div class="p-4 p-md-5">
                                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                                        <div class="d-flex gap-2 align-items-center">
                                            <span class="badge bg-warning text-dark px-3 py-1 fw-bold">${pl.country}</span>
                                            ${pl.category ? `<span class="badge bg-secondary px-3 py-1">${pl.category}</span>` : ''}
                                            ${pl.historicalPeriod ? `<span class="badge bg-dark border border-warning text-warning px-2 py-1">${pl.historicalPeriod}</span>` : ''}
                                        </div>
                                        <div class="d-flex gap-2">
                                            <a href="map.html?placeId=${pl.id}" class="btn btn-sm btn-gold" title="Explore on Historical Map"><i class="bi bi-geo-alt-fill me-1"></i>View on Map</a>
                                            <button class="btn btn-sm ${isFav ? 'btn-warning' : 'btn-outline-gold'}" id="favPlaceBtn" onclick="togglePlaceBookmark()">
                                                <i class="bi ${isFav ? 'bi-bookmark-check-fill' : 'bi-bookmark-plus'} me-1"></i> ${isFav ? 'Bookmarked' : 'Save Place'}
                                            </button>
                                        </div>
                                    </div>
                                    <h1 class="display-6 fw-bold text-white mb-2">${pl.name}</h1>
                                    <div class="text-warning mb-4"><i class="bi bi-geo-alt me-1"></i>${pl.cityOrRegion || (pl.city ? pl.city + (pl.state ? ', ' + pl.state : '') : pl.country)}, ${pl.country} | <strong>Built:</strong> ${pl.builtYear || pl.yearEstablished || 'Ancient'}</div>

                                    <div class="alert alert-dark border-secondary mb-4">
                                        <div class="text-warning fw-bold small text-uppercase mb-1"><i class="bi bi-bank me-1"></i>Historical Significance</div>
                                        <div class="text-light">${pl.historicalSignificance}</div>
                                    </div>

                                    <h4 class="text-white fw-bold mb-3">Architectural & Historical Overview</h4>
                                    <div class="text-light leading-relaxed mb-4" style="line-height: 1.8; font-size: 1.05rem;">
                                        ${pl.description}
                                    </div>

                                    <!-- Live Wikipedia Deep Dive Section -->
                                    <div class="p-4 rounded bg-dark border border-warning border-opacity-50 mb-4 shadow-sm">
                                        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                                            <h5 class="text-white fw-bold mb-0">
                                                <i class="bi bi-book-half text-warning me-2"></i>Live Wikipedia Heritage Archive
                                            </h5>
                                            <span class="badge bg-secondary text-light"><i class="bi bi-broadcast me-1"></i>Wikimedia REST API</span>
                                        </div>
                                        <div id="wikiContent" class="text-light">
                                            <div class="spinner-border spinner-border-sm text-warning me-2" role="status"></div> Fetching live heritage records...
                                        </div>
                                    </div>

                                    <a href="ai-guide.html?q=${encodeURIComponent('Tell me the architectural secrets and history of ' + pl.name)}" class="btn btn-gold">
                                        <i class="bi bi-robot me-2"></i>Ask AI Guide About This Monument
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="historical-card p-4 mb-4">
                                <h5 class="fw-bold text-white mb-3"><i class="bi bi-calendar-check text-warning me-2"></i>Associated Events</h5>
                                ${pl.relatedEvents && pl.relatedEvents.length > 0 ? `
                                    <div class="row g-3">
                                        ${pl.relatedEvents.map(e => `
                                            <div class="col-12">
                                                <div class="p-3 rounded bg-dark border border-secondary border-opacity-25">
                                                    <span class="badge bg-warning text-dark mb-1">${e.formattedDate}</span>
                                                    <h6 class="text-white fw-bold mb-1">${e.title}</h6>
                                                    <p class="text-secondary small mb-2">${e.summary}</p>
                                                    <a href="event-detail.html?id=${e.id}" class="btn btn-sm btn-outline-gold">View Event</a>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : '<p class="text-secondary small mb-0">No recorded battles or events directly attached in database.</p>'}
                            </div>
                        </div>
                    </div>
                `;

                // Load Wikipedia live extract
                loadWikipediaArchive(pl.name);
            } catch (err) {
                container.innerHTML = '<div class="text-center text-danger py-5">Error loading monument details.</div>';
            }
        }

        async function togglePlaceBookmark() {
            if (!auth.isLoggedIn()) {
                alert('Please sign in to save historical places!');
                window.location.href = 'login.html';
                return;
            }

            try {
                await api.post('/favorites', {
                    entityType: 'Place',
                    entityId: currentPlace.id,
                    title: currentPlace.name,
                    imageUrl: currentPlace.imageUrl
                });

                const btn = document.getElementById('favPlaceBtn');
                btn.className = 'btn btn-sm btn-warning';
                btn.innerHTML = '<i class="bi bi-bookmark-check-fill me-1"></i> Bookmarked';
            } catch (err) {
                console.error(err);
            }
        }

        async function loadWikipediaArchive(name) {
            const wikiContainer = document.getElementById('wikiContent');
            if (!wikiContainer) return;
            try {
                let wikiQuery = name;
                if (name.includes('Taj Mahal')) wikiQuery = 'Taj_Mahal';
                else if (name.includes('Red Fort')) wikiQuery = 'Red_Fort';
                else if (name.includes('Raigad')) wikiQuery = 'Raigad_Fort';
                else if (name.includes('Ajanta')) wikiQuery = 'Ajanta_Caves';
                else if (name.includes('Konark')) wikiQuery = 'Konark_Sun_Temple';
                else if (name.includes('Qutub')) wikiQuery = 'Qutb_Minar';
                else if (name.includes('Pyramid')) wikiQuery = 'Great_Pyramid_of_Giza';
                else if (name.includes('Colosseum')) wikiQuery = 'Colosseum';
                else if (name.includes('Great Wall')) wikiQuery = 'Great_Wall_of_China';
                else if (name.includes('Machu Picchu')) wikiQuery = 'Machu_Picchu';
                else wikiQuery = encodeURIComponent(name.replace(/\s+/g, '_'));

                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${wikiQuery}`);
                if (!res.ok) throw new Error('Live Wikipedia data unavailable');
                const data = await res.json();

                wikiContainer.innerHTML = `
                    <div class="d-flex flex-column gap-3">
                        <p class="mb-2 text-light" style="line-height: 1.8; font-size: 0.98rem;">
                            ${data.extract || 'No architectural extract available.'}
                        </p>
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top border-secondary border-opacity-25 flex-wrap gap-2">
                            <span class="text-secondary small"><i class="bi bi-info-circle me-1"></i>Official Wikimedia Foundation Archive (CC BY-SA 4.0)</span>
                            <a href="${data.content_urls ? data.content_urls.desktop.page : `https://en.wikipedia.org/wiki/${wikiQuery}`}" target="_blank" class="btn btn-sm btn-outline-warning text-gold px-3">
                                <i class="bi bi-box-arrow-up-right me-1"></i> Read Full Wikipedia Article
                            </a>
                        </div>
                    </div>
                `;
            } catch (err) {
                wikiContainer.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <span class="text-secondary small">Live Wikimedia sync resting. Comprehensive offline architectural records available above.</span>
                        <a href="https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(name)}" target="_blank" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-search me-1"></i> Search on Wikipedia
                        </a>
                    </div>
                `;
            }
        }
    </script>
</body>
