<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Glory of the Past</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark navbar-historical">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-compass text-warning fs-4"></i>
                <span>GLORY OF THE PAST</span>
            </a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="historical-card p-4 p-md-5 shadow-lg">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus text-warning display-5"></i>
                        <h3 class="fw-bold text-white mt-2">Create an Account</h3>
                        <p class="text-secondary small">Join our community of historians and learners</p>
                    </div>

                    <div id="registerAlert" class="alert d-none" role="alert"></div>

                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="mb-3">
                            <label class="form-label text-secondary small text-uppercase fw-bold">Full Name</label>
                            <input type="text" id="regFullName" class="form-control bg-dark text-white border-secondary" placeholder="e.g. Rahul Sharma" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small text-uppercase fw-bold">Email Address</label>
                            <input type="email" id="regEmail" class="form-control bg-dark text-white border-secondary" placeholder="e.g. rahul@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small text-uppercase fw-bold">Password</label>
                            <input type="password" id="regPassword" class="form-control bg-dark text-white border-secondary" placeholder="Minimum 6 characters" minlength="6" required>
                        </div>

                        <button type="submit" id="regBtn" class="btn btn-gold w-100 py-2 fw-bold">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center mt-4 text-secondary small">
                        Already have an account? <a href="login.html" class="text-warning fw-bold text-decoration-none">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const alertBox = document.getElementById('registerAlert');
            const btn = document.getElementById('regBtn');

            alertBox.className = 'alert d-none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

            try {
                const response = await api.post('/auth/register', { fullName, email, password });
                if (response.success && response.token) {
                    auth.saveSession(response.token, {
                        email: response.email,
                        fullName: response.fullName,
                        role: response.role
                    });

                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Account created successfully! Redirecting...';

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 900);
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerText = err.message || 'Registration failed. Please try again.';
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }
    </script>
</body>
</html>
