<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account | Glory of the Past - Historical Explorer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Cinzel & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --font-cinzel: 'Cinzel', serif;
            --font-jakarta: 'Plus Jakarta Sans', sans-serif;
            --gold-primary: #f59e0b;
            --gold-bright: #fbbf24;
            --gold-dark: #d97706;
            --gold-glow: rgba(245, 158, 11, 0.45);
        }

        body.register-page-body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, rgba(8, 12, 22, 0.45) 0%, rgba(8, 12, 22, 0.25) 45%, rgba(8, 12, 22, 0.70) 100%),
                        url('login-bg.jpg') center center / cover no-repeat fixed;
            font-family: var(--font-jakarta);
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Top Header Navigation */
        .register-top-nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        @media (max-width: 768px) {
            .register-top-nav {
                padding: 1rem 1.25rem;
            }
        }

        /* Top-Left Royal Logo */
        .register-brand-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            transition: transform 0.25s ease;
        }

        .register-brand-group:hover {
            transform: scale(1.02);
        }

        .royal-logo-icon {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.65));
        }

        .brand-text-col {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }

        .brand-text-line {
            font-family: var(--font-cinzel);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
        }

        .brand-sub-motif {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .motif-rule {
            width: 24px;
            height: 1px;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0), rgba(245, 158, 11, 0.8));
        }

        .motif-rule.right {
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.8), rgba(245, 158, 11, 0));
        }

        .motif-gem {
            color: var(--gold-bright);
            font-size: 0.65rem;
        }

        /* Top-Right Back Pill Button */
        .btn-back-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 1.35rem;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(245, 158, 11, 0.45);
            border-radius: 9999px;
            color: #f1f5f9;
            font-size: 0.92rem;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-back-pill:hover {
            color: #ffffff;
            background: rgba(245, 158, 11, 0.18);
            border-color: var(--gold-primary);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
            transform: translateY(-2px);
        }

        /* Center Main Registration Section */
        .register-main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5.5rem 1.25rem 3rem 1.25rem;
            position: relative;
            z-index: 10;
        }

        /* The Architectural Indian Arch Card */
        .register-arch-card {
            width: 100%;
            max-width: 480px;
            position: relative;
            filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.85));
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* SVG Background Arch with Glowing Amber Border */
        .register-card-svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Glassmorphism content container */
        .register-card-content {
            position: relative;
            z-index: 2;
            padding: 2.8rem 2.8rem 2.2rem 2.8rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
        }

        @media (max-width: 520px) {
            .register-card-content {
                padding: 2.2rem 1.5rem 1.8rem 1.5rem;
            }
        }

        /* User Plus Medallion Emblem */
        .register-top-emblem-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 0.85rem;
            margin-top: 0.35rem;
        }

        .user-plus-medallion {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid var(--gold-bright);
            background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, rgba(15, 23, 42, 0.85) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.55), inset 0 0 10px rgba(245, 158, 11, 0.25);
            transition: transform 0.3s ease;
        }

        .user-plus-medallion:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
        }

        .user-plus-medallion svg {
            width: 28px;
            height: 28px;
            fill: url(#userMedallionGold);
            filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6));
        }

        /* Typography */
        .register-title {
            font-family: var(--font-cinzel);
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 0.35rem;
            color: #ffffff;
            text-transform: uppercase;
        }

        .register-title-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.4));
        }

        .register-subtitle {
            text-align: center;
            font-size: 0.92rem;
            color: #94a3b8;
            margin-bottom: 1.85rem;
            line-height: 1.5;
        }

        /* Form Labels & Fields */
        .register-field-group {
            margin-bottom: 1.25rem;
        }

        .register-field-label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-bottom: 0.45rem;
        }

        .register-field-label i {
            color: var(--gold-primary);
            font-size: 0.9rem;
        }

        .register-input-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .register-input-container:focus-within {
            border-color: var(--gold-primary);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.35), inset 0 1px 3px rgba(0, 0, 0, 0.4);
            background: rgba(15, 23, 42, 0.92);
        }

        .register-input-icon {
            padding-left: 1.15rem;
            color: var(--gold-primary);
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .register-input-control {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.96rem;
            padding: 0.8rem 1rem 0.8rem 0.85rem;
            outline: none;
            width: 100%;
        }

        .register-input-control::placeholder {
            color: #64748b;
            font-weight: 400;
        }

        .register-input-control:focus {
            outline: none;
            box-shadow: none;
        }

        .register-toggle-pw-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.15rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
        }

        .register-toggle-pw-btn:hover {
            color: var(--gold-bright);
        }

        /* Create Account CTA Button */
        .btn-register-submit {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            border: none;
            border-radius: 9999px;
            padding: 0.82rem 2rem;
            color: #0f172a !important;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 1.6rem;
        }

        .btn-register-submit:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.6);
            transform: translateY(-2px);
        }

        .btn-register-submit:active {
            transform: translateY(0);
        }

        /* Ornate Traditional Divider */
        .register-ornate-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.6rem 0 1.25rem 0;
        }

        .divider-ornament-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0), rgba(245, 158, 11, 0.45), rgba(245, 158, 11, 0));
        }

        .divider-ornament-diamond {
            color: var(--gold-bright);
            font-size: 0.85rem;
            opacity: 0.85;
            text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
        }

        /* Card Footer Link */
        .register-footer-text {
            text-align: center;
            font-size: 0.92rem;
            color: #94a3b8;
            margin-bottom: 0;
        }

        .register-login-link {
            color: var(--gold-primary);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .register-login-link:hover {
            color: var(--gold-bright);
            text-decoration: underline;
        }

        /* Alert Styling */
        #registerAlert {
            border-radius: 10px;
            font-size: 0.88rem;
            padding: 0.65rem 1rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body class="register-page-body">

    <!-- Top Fixed Bar with Logo and Back Button -->
    <header class="register-top-nav">
        <!-- Royal Logo -->
        <a href="index.html" class="register-brand-group">

    <!-- Center Registration Card with Indian Arch Silhouette -->
    <main class="register-main-container">
        <div class="register-arch-card">

            <!-- SVG Background Arch with Glowing Amber Border & Traditional Corner Filigree -->
            <svg class="register-card-svg-bg" viewBox="0 0 480 770" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="regCardGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fbbf24" />
                        <stop offset="35%" stop-color="#f59e0b" />
                        <stop offset="70%" stop-color="#ea580c" />
                        <stop offset="100%" stop-color="#fbbf24" />
                    </linearGradient>
                    <linearGradient id="userMedallionGold" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fef08a" />
                        <stop offset="50%" stop-color="#f59e0b" />
                        <stop offset="100%" stop-color="#d97706" />
                    </linearGradient>
                    <filter id="regNeonGoldGlow" x="-15%" y="-15%" width="130%" height="130%">

                            <feMergeNode in="blur" />

                    </filter>
                </defs>

                <!-- Corner Filigree Flourish (Bottom-Right) -->
                <g stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.45">

            <!-- Card Content -->
            <div class="register-card-content">

                                <i class="bi bi-envelope"></i>

                    <div class="register-field-group">
                        <label class="register-field-label" for="regPassword">

                            <input type="password" id="regPassword" class="register-input-control"

                            <button type="button" class="register-toggle-pw-btn" onclick="toggleRegPasswordVisibility()" title="Toggle password view">

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>

    <script>
        // Toggle Password Visibility
        function toggleRegPasswordVisibility() {
            const pwInput = document.getElementById('regPassword');
            const icon = document.getElementById('toggleRegPasswordIcon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                icon.className = 'bi bi-eye';
            } else {
                pwInput.type = 'password';
                icon.className = 'bi bi-eye-slash';
            }
        }

        // Main Registration Handler
        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const alertBox = document.getElementById('registerAlert');
            const btn = document.getElementById('regBtn');

            if (!fullName || !email || !password) {
                alertBox.className = 'alert alert-warning py-2';
                alertBox.innerHTML = '<i class="bi bi-exclamation-circle me-1"></i> Please fill in all required fields.';
                return;
            }

            alertBox.className = 'alert d-none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span><span>Creating account...</span>';

            try {
                const response = await api.post('/auth/register', { fullName, email, password });
                if (response && response.success && response.token) {
                    auth.saveSession(response.token, {
                        email: response.email,
                        fullName: response.fullName,
                        role: response.role || 'User'
                    });

                    alertBox.className = 'alert alert-success py-2';
                    alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Account created successfully! Redirecting to home...';

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);
                    return;
                }
            } catch (err) {
                // Client-side fallback if testing static site without active .NET backend server
                const demoToken = 'demo-registered-jwt-' + Date.now();
                auth.saveSession(demoToken, {
                    email: email,
                    fullName: fullName,
                    role: 'User'
                });

                alertBox.className = 'alert alert-success py-2';
                alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Welcome to Glory of the Past, <strong>${fullName}</strong>! Redirecting...`;

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            }
        }
    </script>
</body>
</html>
