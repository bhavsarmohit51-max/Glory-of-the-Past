<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Glory of the Past</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Simple Navbar -->
    <nav class="navbar navbar-dark navbar-historical">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-compass text-warning fs-4"></i>
                <span>GLORY OF THE PAST</span>
            </a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="historical-card p-4 p-md-5 shadow-lg">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-warning display-5"></i>
                        <h3 class="fw-bold text-white mt-2">Welcome Back</h3>
                        <p class="text-secondary small">Enter your credentials to access your history portfolio</p>
                    </div>

                    <!-- Alert message -->
                    <div id="loginAlert" class="alert d-none" role="alert"></div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label text-secondary small text-uppercase fw-bold">Email Address</label>
                            <input type="email" id="loginEmail" class="form-control bg-dark text-white border-secondary" placeholder="e.g. explorer@history.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small text-uppercase fw-bold">Password</label>
                            <input type="password" id="loginPassword" class="form-control bg-dark text-white border-secondary" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-gold w-100 py-2 fw-bold">
                            Sign In
                        </button>
                    </form>

                    <!-- Default credentials helper for students/evaluators -->
                    <div class="mt-4 p-3 rounded bg-dark border border-secondary border-opacity-25 small">
                        <div class="text-warning fw-bold mb-2"><i class="bi bi-info-circle me-1"></i>Demo Accounts (Click to Auto-Fill):</div>
                        <div class="d-flex gap-2 flex-wrap mb-2">
                            <button type="button" class="btn btn-sm btn-outline-warning py-1 px-2" onclick="quickFill('admin@historicalexplorer.com', 'Admin@123')">
                                <i class="bi bi-shield-lock-fill me-1"></i>Auto-Fill Admin
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-2 text-light" onclick="quickFill('explorer@history.com', 'User@123')">
                                <i class="bi bi-person-fill me-1"></i>Auto-Fill User
                            </button>
                        </div>
                        <div class="text-secondary small">
                            <strong>Admin:</strong> admin@historicalexplorer.com / Admin@123<br>
                            <strong>User:</strong> explorer@history.com / User@123
                        </div>
                    </div>

                    <div class="text-center mt-4 text-secondary small">
                        Don't have an account? <a href="register.html" class="text-warning fw-bold text-decoration-none">Create Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
        function quickFill(email, password) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const alertBox = document.getElementById('loginAlert');
            const btn = document.getElementById('loginBtn');

            alertBox.className = 'alert d-none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

            try {
                const response = await api.post('/auth/login', { email, password });
                if (response.success && response.token) {
                    auth.saveSession(response.token, {
                        email: response.email,
                        fullName: response.fullName,
                        role: response.role
                    });

                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Login successful! Redirecting...';

                    setTimeout(() => {
                        if (response.role === 'Admin') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 800);
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerText = err.message || 'Invalid email or password.';
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }
    </script>
</body>
</html>
