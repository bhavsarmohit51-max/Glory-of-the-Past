<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Glory of the Past - Historical Explorer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Cinzel & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --font-cinzel: 'Cinzel', serif;
            --font-jakarta: 'Plus Jakarta Sans', sans-serif;
            --gold-primary: #f59e0b;
            --gold-bright: #fbbf24;
            --gold-dark: #d97706;
            --gold-glow: rgba(245, 158, 11, 0.45);
        }

        body.login-page-body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, rgba(8, 12, 22, 0.45) 0%, rgba(8, 12, 22, 0.25) 45%, rgba(8, 12, 22, 0.70) 100%),
                        url('login-bg.jpg') center center / cover no-repeat fixed;
            font-family: var(--font-jakarta);
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Top Header Navigation */
        .login-top-nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        @media (max-width: 768px) {
            .login-top-nav {
                padding: 1rem 1.25rem;
            }
        }

        /* Top-Left Royal Logo */
        .login-brand-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            transition: transform 0.25s ease;
        }

        .login-brand-group:hover {
            transform: scale(1.02);
        }

        .royal-logo-icon {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.65));
        }

        .brand-text-col {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }

        .brand-text-line {
            font-family: var(--font-cinzel);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
        }

        .brand-sub-motif {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .motif-rule {
            width: 24px;
            height: 1px;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0), rgba(245, 158, 11, 0.8));
        }

        .motif-rule.right {
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.8), rgba(245, 158, 11, 0));
        }

        .motif-gem {
            color: var(--gold-bright);
            font-size: 0.65rem;
        }

        /* Top-Right Back Pill Button */
        .btn-back-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 1.35rem;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(245, 158, 11, 0.45);
            border-radius: 9999px;
            color: #f1f5f9;
            font-size: 0.92rem;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-back-pill:hover {
            color: #ffffff;
            background: rgba(245, 158, 11, 0.18);
            border-color: var(--gold-primary);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
            transform: translateY(-2px);
        }

        /* Center Main Login Section */
        .login-main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5.5rem 1.25rem 3rem 1.25rem;
            position: relative;
            z-index: 10;
        }

        /* The Architectural Indian Arch Card */
        .login-arch-card {
            width: 100%;
            max-width: 480px;
            position: relative;
            filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.85));
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* SVG Background Frame with Glowing Arch */
        .login-card-svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Glassmorphism content container */
        .login-card-content {
            position: relative;
            z-index: 2;
            padding: 2.8rem 2.8rem 2.2rem 2.8rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
        }

        @media (max-width: 520px) {
            .login-card-content {
                padding: 2.2rem 1.5rem 1.8rem 1.5rem;
            }
        }

        /* Card Top Emblem */
        .login-top-emblem-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 0.85rem;
            margin-top: 0.5rem;
        }

        .login-palace-emblem {
            width: 72px;
            height: 52px;
            filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.75));
            transition: transform 0.3s ease;
        }

        .login-palace-emblem:hover {
            transform: scale(1.08);
        }

        /* Typography */
        .login-title {
            font-family: var(--font-cinzel);
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 0.35rem;
            color: #ffffff;
            text-transform: uppercase;
        }

        .login-title-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.4));
        }

        .login-subtitle {
            text-align: center;
            font-size: 0.92rem;
            color: #94a3b8;
            margin-bottom: 1.85rem;
            line-height: 1.5;
        }

        /* Form Labels & Fields */
        .login-field-group {
            margin-bottom: 1.25rem;
        }

        .login-field-label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-bottom: 0.45rem;
        }

        .login-field-label i {
            color: var(--gold-primary);
            font-size: 0.9rem;
        }

        .login-input-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .login-input-container:focus-within {
            border-color: var(--gold-primary);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.35), inset 0 1px 3px rgba(0, 0, 0, 0.4);
            background: rgba(15, 23, 42, 0.92);
        }

        .login-input-icon {
            padding-left: 1.15rem;
            color: var(--gold-primary);
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .login-input-control {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.96rem;
            padding: 0.8rem 1rem 0.8rem 0.85rem;
            outline: none;
            width: 100%;
        }

        .login-input-control::placeholder {
            color: #64748b;
            font-weight: 400;
        }

        .login-input-control:focus {
            outline: none;
            box-shadow: none;
        }

        .login-toggle-pw-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.15rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
        }

        .login-toggle-pw-btn:hover {
            color: var(--gold-bright);
        }

        /* Remember Me & Forgot Password Row */
        .login-options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.1rem 0 1.6rem 0;
            font-size: 0.88rem;
        }

        .custom-remember-label {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            cursor: pointer;
            color: #cbd5e1;
            user-select: none;
            margin-bottom: 0;
        }

        .custom-remember-label input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--gold-primary);
            border-radius: 4px;
            background: rgba(15, 23, 42, 0.8);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            outline: none;
        }

        .custom-remember-label input[type="checkbox"]:checked {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border-color: var(--gold-bright);
        }

        .custom-remember-label input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0b0f19;
            font-size: 0.8rem;
            font-weight: 900;
        }

        .login-forgot-link {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .login-forgot-link:hover {
            color: var(--gold-bright);
            text-decoration: underline;
        }

        /* Sign In CTA Button */
        .btn-login-submit {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            border: none;
            border-radius: 9999px;
            padding: 0.82rem 2rem;
            color: #0f172a !important;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-login-submit:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.6);
            transform: translateY(-2px);
        }

        .btn-login-submit:active {
            transform: translateY(0);
        }

        /* Ornate Traditional Divider */
        .login-ornate-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.6rem 0 1.25rem 0;
        }

        .divider-ornament-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0), rgba(245, 158, 11, 0.45), rgba(245, 158, 11, 0));
        }

        .divider-ornament-diamond {
            color: var(--gold-bright);
            font-size: 0.85rem;
            opacity: 0.85;
            text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
        }

        /* Card Footer Link */
        .login-footer-text {
            text-align: center;
            font-size: 0.92rem;
            color: #94a3b8;
            margin-bottom: 0;
        }

        .login-create-acc-link {
            color: var(--gold-primary);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-create-acc-link:hover {
            color: var(--gold-bright);
            text-decoration: underline;
        }

        /* Demo Accounts 1-Click Helper */
        .demo-accounts-pill-box {
            margin-top: 1.5rem;
            background: rgba(15, 23, 42, 0.65);
            border: 1px dashed rgba(245, 158, 11, 0.35);
            border-radius: 12px;
            padding: 0.65rem 0.9rem;
            text-align: center;
        }

        .demo-pill-btn {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-radius: 9999px;
            color: #f1f5f9;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .demo-pill-btn:hover {
            background: var(--gold-primary);
            color: #0f172a;
        }

        /* Alert Styling */
        #loginAlert {
            border-radius: 10px;
            font-size: 0.88rem;
            padding: 0.65rem 1rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body class="login-page-body">

    <!-- Top Fixed Bar with Logo and Back Button -->
    <header class="login-top-nav">
        <!-- Royal Logo -->
        <a href="index.html" class="login-brand-group">
            <svg class="royal-logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fde68a" />
                        <stop offset="40%" stop-color="#f59e0b" />
                        <stop offset="100%" stop-color="#b45309" />
                    </linearGradient>
                </defs>
                <!-- Central Dome & Finial -->
                <path d="M32 6 C32 10 30 14 26 18 C23 20 22 24 22 28 L42 28 C42 24 41 20 38 18 C34 14 32 10 32 6 Z" fill="url(#logoGoldGrad)" />
                <path d="M32 2 L32 7 M30 4 L34 4" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" />
                <!-- Side Minaret Domes -->
                <path d="M12 20 C12 24 15 28 17 30 L10 30 C10 26 11 23 12 20 Z" fill="url(#logoGoldGrad)" opacity="0.9" />
                <path d="M52 20 C52 24 49 28 47 30 L54 30 C54 26 53 23 52 20 Z" fill="url(#logoGoldGrad)" opacity="0.9" />
                <!-- Pillars and Arches Base -->
                <rect x="8" y="30" width="48" height="6" rx="2" fill="url(#logoGoldGrad)" />
                <path d="M12 36 L12 54 M22 36 L22 54 M42 36 L42 54 M52 36 L52 54" stroke="url(#logoGoldGrad)" stroke-width="3" stroke-linecap="round" />
                <!-- Center Grand Arch Entrance -->
                <path d="M26 54 L26 44 C26 40 28 38 32 38 C36 38 38 40 38 44 L38 54 Z" fill="url(#logoGoldGrad)" />
                <rect x="6" y="54" width="52" height="4" rx="1.5" fill="url(#logoGoldGrad)" />
            </svg>
            <div class="brand-text-col">
                <span class="brand-text-line">GLORY OF</span>
                <span class="brand-text-line">THE PAST</span>
                <div class="brand-sub-motif">
                    <span class="motif-rule"></span>
                    <span class="motif-gem">❖</span>
                    <span class="motif-rule right"></span>
                </div>
            </div>
        </a>

        <!-- Back to Home Button -->
        <a href="index.html" class="btn-back-pill">
            <i class="bi bi-arrow-left"></i>
            <span>Back to Home</span>
        </a>
    </header>

    <!-- Center Login Card with Indian Arch Silhouette -->
    <main class="login-main-container">
        <div class="login-arch-card">

            <!-- SVG Background Arch with Glowing Amber Border & Traditional Corner Filigree -->
            <svg class="login-card-svg-bg" viewBox="0 0 480 720" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="cardGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fbbf24" />
                        <stop offset="35%" stop-color="#f59e0b" />
                        <stop offset="70%" stop-color="#ea580c" />
                        <stop offset="100%" stop-color="#fbbf24" />
                    </linearGradient>
                    <filter id="neonGoldGlow" x="-15%" y="-15%" width="130%" height="130%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- Classic Ogee / Indian Arch Perimeter Path -->
                <path d="M 28 68 
                         C 105 68, 160 50, 195 28 
                         C 218 15, 230 4, 240 1 
                         C 250 4, 262 15, 285 28 
                         C 320 50, 375 68, 452 68 
                         C 466 68, 476 78, 476 92 
                         L 476 694 
                         C 476 708, 466 718, 452 718 
                         L 28 718 
                         C 14 718, 4 708, 4 694 
                         L 4 92 
                         C 4 78, 14 68, 28 68 Z"
                      fill="rgba(13, 19, 33, 0.88)"
                      stroke="url(#cardGoldStroke)"
                      stroke-width="2.2"
                      filter="url(#neonGoldGlow)"
                      vector-effect="non-scaling-stroke" />

                <!-- Corner Filigree Flourish (Top-Left) -->
                <g stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.45">
                    <path d="M 24 100 C 24 82, 38 82, 56 82" />
                    <path d="M 24 112 C 24 88, 44 88, 68 88" />
                    <circle cx="36" cy="94" r="2.5" fill="#f59e0b" />
                </g>
                <!-- Corner Filigree Flourish (Top-Right) -->
                <g stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.45">
                    <path d="M 456 100 C 456 82, 442 82, 424 82" />
                    <path d="M 456 112 C 456 88, 436 88, 412 88" />
                    <circle cx="444" cy="94" r="2.5" fill="#f59e0b" />
                </g>
                <!-- Corner Filigree Flourish (Bottom-Left) -->
                <g stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.45">
                    <path d="M 24 686 C 24 704, 38 704, 56 704" />
                    <path d="M 24 674 C 24 698, 44 698, 68 698" />
                    <circle cx="36" cy="692" r="2.5" fill="#f59e0b" />
                </g>
                <!-- Corner Filigree Flourish (Bottom-Right) -->
                <g stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.45">
                    <path d="M 456 686 C 456 704, 442 704, 424 704" />
                    <path d="M 456 674 C 456 698, 436 698, 412 698" />
                    <circle cx="444" cy="692" r="2.5" fill="#f59e0b" />
                </g>
            </svg>

            <!-- Card Content -->
            <div class="login-card-content">
                <!-- Golden Palace Emblem in the Arch Crown -->
                <div class="login-top-emblem-wrap">
                    <svg class="login-palace-emblem" viewBox="0 0 72 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fef08a" />
                                <stop offset="45%" stop-color="#f59e0b" />
                                <stop offset="100%" stop-color="#b45309" />
                            </linearGradient>
                        </defs>
                        <!-- Grand Central Dome -->
                        <path d="M36 4 C36 9 33 13 28 17 C25 19 24 23 24 27 L48 27 C48 23 47 19 44 17 C39 13 36 9 36 4 Z" fill="url(#emblemGold)" />
                        <path d="M36 0 L36 5" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round" />
                        <!-- Left Minaret & Chhatri -->
                        <path d="M12 16 C12 20 15 24 17 26 L10 26 C10 22 11 19 12 16 Z" fill="url(#emblemGold)" opacity="0.9" />
                        <path d="M12 12 L12 16" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
                        <rect x="9" y="26" width="6" height="18" fill="url(#emblemGold)" opacity="0.85" />
                        <!-- Right Minaret & Chhatri -->
                        <path d="M60 16 C60 20 57 24 55 26 L62 26 C62 22 61 19 60 16 Z" fill="url(#emblemGold)" opacity="0.9" />
                        <path d="M60 12 L60 16" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
                        <rect x="57" y="26" width="6" height="18" fill="url(#emblemGold)" opacity="0.85" />
                        <!-- Main Palace Structure & Pillars -->
                        <rect x="15" y="27" width="42" height="5" rx="1.5" fill="url(#emblemGold)" />
                        <path d="M18 32 L18 46 M26 32 L26 46 M46 32 L46 46 M54 32 L54 46" stroke="url(#emblemGold)" stroke-width="2.5" stroke-linecap="round" />
                        <!-- Glowing Center Arch Gateway -->
                        <path d="M30 46 L30 38 C30 34 32 32 36 32 C40 32 42 34 42 38 L42 46 Z" fill="#fef08a" opacity="0.95" />
                        <path d="M32 46 L32 40 C32 37 34 35 36 35 C38 35 40 37 40 40 L40 46 Z" fill="#0f172a" />
                        <!-- Base Plinth -->
                        <rect x="6" y="46" width="60" height="4" rx="2" fill="url(#emblemGold)" />
                    </svg>
                </div>

                <!-- Headline -->
                <h1 class="login-title">
                    WELCOME <span class="login-title-gold">BACK</span>
                </h1>
                <p class="login-subtitle">
                    Enter your credentials to access your history portfolio
                </p>

                <!-- Feedback Alert Container -->
                <div id="loginAlert" class="alert d-none" role="alert"></div>

                <!-- Sign In Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <!-- Email Address Field -->
                    <div class="login-field-group">
                        <label class="login-field-label" for="loginEmail">
                            <i class="bi bi-envelope-fill"></i> EMAIL ADDRESS
                        </label>
                        <div class="login-input-container">
                            <div class="login-input-icon">
                                <i class="bi bi-envelope"></i>
                            </div>
                            <input type="email" id="loginEmail" class="login-input-control" 
                                   placeholder="Enter your email address" required autocomplete="email">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="login-field-group">
                        <label class="login-field-label" for="loginPassword">
                            <i class="bi bi-lock-fill"></i> PASSWORD
                        </label>
                        <div class="login-input-container">
                            <div class="login-input-icon">
                                <i class="bi bi-lock"></i>
                            </div>
                            <input type="password" id="loginPassword" class="login-input-control" 
                                   placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="login-toggle-pw-btn" onclick="togglePasswordVisibility()" title="Toggle password view">
                                <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="login-options-row">
                        <label class="custom-remember-label">
                            <input type="checkbox" id="rememberMe" checked>
                            <span>Remember me</span>
                        </label>
                        <a href="javascript:void(0)" class="login-forgot-link" onclick="handleForgotPassword()">
                            Forgot Password?
                        </a>
                    </div>

                    <!-- Capsule Sign In Button -->
                    <button type="submit" id="loginBtn" class="btn-login-submit">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span>Sign In</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <!-- Traditional Ornate Divider -->
                <div class="login-ornate-divider">
                    <span class="divider-ornament-line"></span>
                    <span class="divider-ornament-diamond">❖</span>
                    <span class="divider-ornament-line"></span>
                </div>

                <!-- Footer Sign Up Link -->
                <p class="login-footer-text">
                    Don't have an account? <a href="register.html" class="login-create-acc-link">Create Account</a>
                </p>

                <!-- 1-Click Demo Accounts Bar for Instant Evaluation -->
                <div class="demo-accounts-pill-box">
                    <span class="text-warning small me-2"><i class="bi bi-stars"></i> Demo Accounts:</span>
                    <div class="d-inline-flex gap-2 flex-wrap mt-1">
                        <button type="button" class="demo-pill-btn" onclick="quickFill('admin@historicalexplorer.com', 'Admin@123')">
                            <i class="bi bi-shield-lock-fill me-1"></i>Admin (1-Click)
                        </button>
                        <button type="button" class="demo-pill-btn" onclick="quickFill('explorer@history.com', 'User@123')">
                            <i class="bi bi-person-fill me-1"></i>User (1-Click)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>

    <script>
        // Check if email was remembered
        document.addEventListener('DOMContentLoaded', () => {
            const remembered = localStorage.getItem('remembered_login_email');
            if (remembered) {
                document.getElementById('loginEmail').value = remembered;
            }
        });

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const pwInput = document.getElementById('loginPassword');
            const icon = document.getElementById('togglePasswordIcon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                icon.className = 'bi bi-eye';
            } else {
                pwInput.type = 'password';
                icon.className = 'bi bi-eye-slash';
            }
        }

        // Quick Fill Demo Credentials
        function quickFill(email, password) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
            const alertBox = document.getElementById('loginAlert');
            alertBox.className = 'alert alert-info py-2';
            alertBox.innerHTML = `<i class="bi bi-check-circle me-1"></i> Auto-filled <strong>${email}</strong>. Click <strong>Sign In</strong> to proceed!`;
        }

        // Forgot Password Handler
        function handleForgotPassword() {
            const email = document.getElementById('loginEmail').value.trim();
            const alertBox = document.getElementById('loginAlert');
            alertBox.className = 'alert alert-warning py-2';
            if (email) {
                alertBox.innerHTML = `<i class="bi bi-envelope-check me-1"></i> Password reset instructions have been dispatched to <strong>${email}</strong>!`;
            } else {
                alertBox.innerHTML = `<i class="bi bi-info-circle me-1"></i> Please enter your email address above and click <strong>Forgot Password</strong> again to receive reset instructions.`;
            }
        }

        // Main Login Handler
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const alertBox = document.getElementById('loginAlert');
            const btn = document.getElementById('loginBtn');

            if (rememberMe) {
                localStorage.setItem('remembered_login_email', email);
            } else {
                localStorage.removeItem('remembered_login_email');
            }

            alertBox.className = 'alert d-none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span><span>Signing in...</span>';

            try {
                const response = await api.post('/auth/login', { email, password });
                if (response && response.success && response.token) {
                    auth.saveSession(response.token, {
                        email: response.email,
                        fullName: response.fullName,
                        role: response.role
                    });

                    alertBox.className = 'alert alert-success py-2';
                    alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Login successful! Redirecting to your dashboard...';

                    setTimeout(() => {
                        if (response.role === 'Admin') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 800);
                    return;
                }
            } catch (err) {
                // Seamless Demo Account Fallback when running without live .NET backend
                if (email.toLowerCase() === 'admin@historicalexplorer.com' && password === 'Admin@123') {
                    auth.saveSession('demo-admin-jwt-token', {
                        email: 'admin@historicalexplorer.com',
                        fullName: 'System Administrator',
                        role: 'Admin'
                    });
                    alertBox.className = 'alert alert-success py-2';
                    alertBox.innerHTML = '<i class="bi bi-shield-check me-1"></i> Admin session authorized! Redirecting to Admin Dashboard...';
                    setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 800);
                    return;
                } else if (email.toLowerCase() === 'explorer@history.com' && password === 'User@123') {
                    auth.saveSession('demo-user-jwt-token', {
                        email: 'explorer@history.com',
                        fullName: 'History Explorer',
                        role: 'User'
                    });
                    alertBox.className = 'alert alert-success py-2';
                    alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Welcome back, Explorer! Redirecting to Home...';
                    setTimeout(() => { window.location.href = 'index.html'; }, 800);
                    return;
                }

                alertBox.className = 'alert alert-danger py-2';
                alertBox.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-1"></i> ${err.message || 'Invalid email or password. Please verify your credentials.'}`;
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i><span>Sign In</span><i class="bi bi-arrow-right"></i>';
            }
        }
    </script>
</body>
</html>
